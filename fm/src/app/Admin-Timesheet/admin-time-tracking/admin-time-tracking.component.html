<div class="accordion-content">
  <h2 class="page-title">Timesheet Summary</h2>
  <table class="classic-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Project</th>
        <th>Total Hrs</th>
        <th>Description</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let entry of timesheetSummary">
        <td>{{entry.username }}</td>
        <td>{{ entry.rows[0]?.project }}</td>
       
        <td>{{ entry.total}}</td>
        <td>
    <button (click)="openNotes(entry)">
      View
    </button>
  </td>
        <td>
          <span [ngClass]="{
    'approved-status': entry.status === 'Approved',
    'rejected-status': entry.status === 'Rejected',
    'pending-status': entry.status === 'Pending'}">
            {{ entry.status }} </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="popup-overlay" *ngIf="showPopup">

  <div class="popup-box">

    <h3>Timesheet Notes</h3>

    <table class="notes-table">

      <tr>
        <th>Date</th>
        <th>Hours</th>
        <th>Notes</th>
      </tr>

      <ng-container *ngFor="let row of selectedEntry?.rows">
        <ng-container *ngFor="let day of row.details">
          <ng-container *ngFor="let d of day">

            <tr *ngIf="d.notes">

              <td>{{ d.date }}</td>

              <td>{{ d.hours }}</td>

              <td>{{ d.notes }}</td>

            </tr>

          </ng-container>
        </ng-container>
      </ng-container>

    </table>

    <br>

    <button (click)="closePopup()">Close</button>

  </div>

</div>
